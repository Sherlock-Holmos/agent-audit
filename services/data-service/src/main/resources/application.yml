server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: data-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/agent_audit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  sql:
    init:
      mode: always
      continue-on-error: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  task:
    core-pool-size: ${TASK_CORE_POOL_SIZE:4}
    max-pool-size: ${TASK_MAX_POOL_SIZE:8}
    queue-capacity: ${TASK_QUEUE_CAPACITY:100}
  alert:
    webhook-url: ${APP_ALERT_WEBHOOK_URL:}
    webhook-urls: ${APP_ALERT_WEBHOOK_URLS:}
    suppress-seconds: ${APP_ALERT_SUPPRESS_SECONDS:300}
  datasource:
    upload-dir: ../../data/uploads
    staging-schema: ${APP_DATASOURCE_STAGING_SCHEMA:agent_audit_staging}
  fusion:
    # Optional JSON map for synonym extension. Example:
    # {"整改单位ID":["单位ID","org_id"],"整改事项ID":["事项ID","issue_id"]}
    key-synonyms-json: ${APP_FUSION_KEY_SYNONYMS_JSON:}
  nifi:
    enabled: ${APP_NIFI_ENABLED:false}
    base-url: ${APP_NIFI_BASE_URL:http://localhost:8090}
    timeout-seconds: ${APP_NIFI_TIMEOUT_SECONDS:5}
    default-process-group-id: ${APP_NIFI_DEFAULT_PROCESS_GROUP_ID:}
